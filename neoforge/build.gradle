plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

// Dev-run-only mods: on the run classpath, but not published as dependencies.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

// GameTests live in their own source set so they are available in dev runs but never packed into the mod jar.
// Run them with "./gradlew :neoforge:runGameTestServer".
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            systemProperty('forge.logging.markers', 'REGISTRIES')
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Output goes to :common's generated resources (packed by every loader); hand-written assets live in :common's main resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    addModdingDependenciesTo(sourceSets.gametest)
}

dependencies {
    gametestCompileOnly "maven.modrinth:cobblemon:${cobblemon_neoforge_modrinth_id}"
    gametestCompileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"

    implementation "maven.modrinth:cobblemon:${cobblemon_neoforge_modrinth_id}"
    implementation "curse.maven:kotlin-for-forge-351264:6994056"
    // Kotlin types from Cobblemon's API are referenced by the common sources compiled here; Kotlin for Forge provides them at runtime.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    localRuntime "curse.maven:cobblemon-mega-showdown-1189523:7523097"
    localRuntime "curse.maven:architectury-api-419699:5786327"
    localRuntime "curse.maven:owo-lib-532610:6785734"
    localRuntime "curse.maven:accessories-938917:7046407"
    compileOnly "curse.maven:jade-324717:${jade_neoforge_file}"
    localRuntime "curse.maven:jade-324717:${jade_neoforge_file}"
    localRuntime "curse.maven:super-factory-manager-306935:7736527"
}

publishMods {
    file.set(jar.archiveFile)
    type = STABLE
    modLoaders.add("neoforge")
    changelog = rootProject.file("changelog.md").text
    displayName = mod_id + "-" + project.version + "+" + minecraft_version + "-neoforge"

    curseforge {
        projectId = "1437573"
        accessToken = findProperty("CF_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("cobblemon")
    }

    modrinth {
        projectId = "iTqv0DeF"
        accessToken = findProperty("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("cobblemon")
    }
}
